#################################
# BACKEND
#################################
backend = "glx";
vsync = true;
use-damage = true;

#################################
# GENERAL SETTINGS
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# SHADOW (Catppuccin Soft Look)
#################################
shadow = true;
shadow-radius = 20;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#1e1e2e";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Rofi'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
# FADING
#################################
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

#################################
# TRANSPARENCY (Disabled)
#################################
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

inactive-opacity-override = false;

# Removed specific app rules to ensure 100% opacity everywhere
opacity-rule = [];

#################################
# BLUR (Removed)
#################################
# Blur section deleted to improve performance and clarity

#################################
# WINDOW TYPES
#################################
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};

#################################
# PERFORMANCE & FIXES
#################################
glx-copy-from-front = false;
unredir-if-possible = true;
detect-client-opacity = true;
xrender-sync-fence = true;

unredir-if-possible-exclude = [
  "class_g = 'Firefox' && focused",
  "class_g = 'Chromium' && focused"
];
