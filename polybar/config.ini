;==========================================================
;   Chicago95 Retro Classic - Centered Date & Icons
;==========================================================

[colors]
background = #c0c0c0
background-alt = #808080
foreground = #000000
primary = #000080
disabled = #808080
light-gray = #d4d0c8
white = #ffffff

[bar/main]
width = 98%
height = 20pt
radius = 0

offset-x = 1%
offset-y = 8pt

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

padding-left = 1
padding-right = 1

module-margin = 0
separator = " | "
separator-foreground = ${colors.disabled}

; Reverted back to your clean Nerd Font configuration
font-0 = "JetBrainsMono Nerd Font:size=9.5;4"
font-1 = "JetBrainsMono Nerd Font:size=9.5:weight=bold;4"

; Date moved to center, volume and tray stay on the right
modules-left = xworkspaces
modules-center = date
modules-right = alsa tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces

label-active = " %name% "
label-active-background = ${colors.primary}
label-active-foreground = ${colors.white}
label-active-padding = 1

label-occupied = 
label-occupied-padding = 0

label-urgent = 
label-urgent-padding = 0

label-empty = 
label-empty-padding = 0

[module/date]
type = internal/date
interval = 1

date = %I:%M %p
date-alt = %A, %d %B %Y

label = %date%
label-foreground = ${colors.foreground}
label-padding = 1

[module/alsa]
type = internal/alsa

master-soundcard = default
mixer-name = Master

format-volume = <label-volume>
; Added your classic speaker icon back
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.foreground}
label-volume = %percentage%%
label-volume-padding = 1

format-muted = <label-muted>
label-muted = "󰝟 Muted"
label-muted-foreground = ${colors.disabled}
label-muted-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 14px

[settings]
screenchange-reload = true
pseudo-transparency = true
